[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qs-trx-server"
version = "1.0.0"
description = "TRX strategy research, execution and operations backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
dependencies = [
  "ccxt>=4.5.76",
  "numpy>2.0,<3.0",
  "pandas>=2.2.0,<4.0",
  "pyarrow",
  "pydantic>=2.2.0",
  "fastapi",
  "uvicorn",
  "PyJWT>=2.0",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock", "httpx>=0.24.1", "ruff"]

[project.urls]
Repository = "https://github.com/Quantitative-Strategies/qs-trx-server"

[project.scripts]
trx-server = "freqtrade.rpc.api_server.app:main"
trx-replay = "freqtrade.strategy.trx_phase1.__main__:main"

[tool.setuptools.packages.find]
include = ["freqtrade*"]

[tool.pytest.ini_options]
testpaths = ["tests/strategy/trx_phase1"]

[tool.ruff]
line-length = 100
# TODO: markdown files should be linted.
extend-exclude = [".env", ".venv", "*.md"]

[tool.ruff.lint]
extend-select = [
  "C90",    # mccabe
  "B",      # bugbear
  # "N",    # pep8-naming
  "F",      # pyflakes
  "E",      # pycodestyle
  "W",      # pycodestyle
  "UP",     # pyupgrade
  "I",      # isort
  "A",      # flake8-builtins
  "TID",    # flake8-tidy-imports
  # "C4",     # flake8-comprehensions
  "YTT",    # flake8-2020
  "S",      # flake8-bandit
  # "RSE",  # flake8-raise
  # "TCH",  # flake8-type-checking
  "PTH",    # flake8-use-pathlib
  "RUF",    # ruff
  "ASYNC",  # flake8-async
  "NPY",    # numpy
]

extend-ignore = [
  "E241",  # Multiple spaces after comma
  "E272",  # Multiple spaces before keyword
  "E221",  # Multiple spaces before operator
  "B904",  # BugBear - except raise from
  "S603",  # `subprocess` call: check for execution of untrusted input
  "S607",  # Starting a process with a partial executable path
  "S608",  # Possible SQL injection vector through string-based query construction
  "NPY002",  # Numpy legacy random generator
  "RUF010",  # Use explicit conversion flag
  "RUF012",  # mutable-class-default
  "RUF022",  # unsorted-dunder-all
  "RUF005",  # list concatenation
  "BLE001",  # Do not catch blind exception: `Exception`
  "SIM117",  # Multiple with statements
  # TODO: the below rules are in the default now and should be reconsidered.
  "N999",  # Invalid module name
  # "DTZ",  # Use timezone-aware datetime objects
  "DTZ007",  # Use timezone-aware datetime objects
  "TRY401",  # Redundant exception object in logging.exception call
  "TRY004",  # Wrong exception type when raising for type error
]

[tool.ruff.lint.per-file-ignores]

"tests/**.py" = [
  "S101",  # allow assert in tests
  "S104",  #  Possible binding to all interfaces
  "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
  "S105",  # Possible hardcoded password assigned to: "secret"
  "S106",  # Possible hardcoded password assigned to argument: "token_type"
  "S110",  # `try`-`except`-`pass` detected, consider logging the exception
  "TRY002", # create your own Exception
  "DTZ005",  # Use timezone-aware datetime objects
  "DTZ", # Use timezone-aware datetime objects
  ]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["freqtrade"]
